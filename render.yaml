databases:
  - name: vel-db
    databaseName: vel_exhibition
    user: vel_exhibition_user

services:
  - type: web
    name: vel-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app manage.py init-db
    startCommand: gunicorn --bind 0.0.0.0:$PORT manage:app
    envVars:
      - key: FLASK_APP
        value: manage.py
      - key: DATABASE_URL
        fromDatabase:
          name: vel-db
          property: connectionString

  - type: web
    name: vel-frontend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: vel-backend
          type: web
          property: url
          appendPath: /api
